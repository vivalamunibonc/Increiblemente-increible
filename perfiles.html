    <button class="Botonvira" onclick="activarSensor()">Activar</button>

<script>
function activarSensor() {
    if (typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission()
            .then(permission => {
                if (permission === "granted") {
                    iniciarDetector();
                }
            });
    } else {
        iniciarDetector();
    }
}

function iniciarDetector() {
    window.addEventListener("devicemotion", detectarMovimiento);
}

function detectarMovimiento(event) {
    const aceleracion = event.accelerationIncludingGravity;

    const fuerza = Math.abs(aceleracion.x) +
                   Math.abs(aceleracion.y) +
                   Math.abs(aceleracion.z);

    if (fuerza > 35) {
        window.location.href = "alex.html";
    }
}
</script>
